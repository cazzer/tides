<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The PNG for browsers without SVG favicons; the SVG last, as browsers
         that take it pick the last icon that fits. -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/tides/icon-192.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/tides/icon.svg"
    />
    <!-- The loading screen shows the mark (LoadingOverlay). -->
    <link
      rel="preload"
      as="image"
      type="image/svg+xml"
      href="/tides/icon.svg"
    />
    <!-- viewport-fit=cover lets the canvas run behind the notch and the home
         indicator; overlays keep clear of them with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- Space black, so browser chrome tinted from it blends into the scene. -->
    <meta
      name="theme-color"
      content="#000000"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <!-- Draws the status bar over the page, so the scene shows behind it. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Tides"
    />
    <link
      rel="manifest"
      href="/tides/manifest.webmanifest"
    />
    <link
      rel="apple-touch-icon"
      href="/tides/apple-touch-icon.png"
    />
    <title>Tides</title>
    <meta
      name="description"
      content="The Earth, Moon and planets as they are now, and the tides they raise."
    />
    <!-- Link previews. Vite leaves meta content alone, so these are absolute
         URLs under the GitHub Pages base (vite.config.ts base: /tides/). -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:site_name"
      content="Tides"
    />
    <meta
      property="og:title"
      content="Tides"
    />

      content="The Earth, Moon and planets as they are now, and the tides they raise."
    />

      content="https://cazzer.github.io/tides/og-image.png"

      content="image/png"
    />
    <meta

      content="630"
    />
    <meta
      property="og:image:alt"
      content="The Sun, Earth and Moon in Tides, with the year's months round Earth's orbit"
