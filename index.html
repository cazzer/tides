<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/vite.svg"
    />
    <!-- viewport-fit=cover lets the canvas run behind the notch and the home
         indicator; overlays keep clear of them with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- Space black, so browser chrome tinted from it blends into the scene. -->
    <meta
      name="theme-color"
      content="#000000"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <!-- Draws the status bar over the page, so the scene shows behind it. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Tides"
    />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <title>Tides (Clock)</title>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
